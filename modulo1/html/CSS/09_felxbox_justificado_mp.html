<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendizaje de Idiomas</title>
    <link rel="stylesheet" href="09_felxbox_justificado.css">
</head>
<body>

    <h1>Ejemplos de justify-content</h1>
  
    <h2>flex-start (inicio)</h2>
    <div class="contenedor inicio">
      <div class="item">Inglés</div>
      <div class="item">Francés</div>
      <div class="item">Italiano</div>
    </div>
  
    <h2>flex-end (fin)</h2>
    <div class="contenedor fin">
      <div class="item">Gramática</div>
      <div class="item">Lectura</div>
      <div class="item">Pronunciación</div>
    </div>
  
    <h2>center (centro)</h2>
    <div class="contenedor centro">
      <div class="item">Nivel A1</div>
      <div class="item">Nivel B1</div>
      <div class="item">Nivel C1</div>
    </div>
  
    <h2>space-between</h2>
    <div class="contenedor between">
      <div class="item">Cursos</div>
      <div class="item">Clases</div>
      <div class="item">Tareas</div>
    </div>
  
    <h2>space-around</h2>
    <div class="contenedor around">
      <div class="item">Escuchar</div>
      <div class="item">Hablar</div>
      <div class="item">Escribir</div>
    </div>
  
    <h2>space-evenly</h2>
    <div class="contenedor evenly">
      <div class="item">Profesor</div>
      <div class="item">Alumno</div>
      <div class="item">Examen</div>
    </div>
  
  </body>
  </html>
