<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        h2 {
            color:green;
            font-size: 3rem;
        }
    </style>
    <link rel="stylesheet" href="04_reset.css">
    <link rel="stylesheet" href="04_display.css">
    
</head>
<body>
    <h1 style="color: blue;">Aprendizaje de Idiomas</h1>
    <div class="banner-oferta">📘 Nuevo curso de inglés disponible </div>
    <div class="etiqueta-nuevo">Nuevo idioma </div>
    <button class="btn-carrito">Comenzar curso </button>

    <button onclick="toggleMenu()">Menu</button>
    <div id="menu" class="menu-movil">
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Cursos</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </div>
    <script>
        function toggleMenu(){
            const menu = document.getElementById('menu')
            menu.classList.toggle('activo')
        }
    </script>


    
</body> 
</html>
