<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendizaje de Idiomas</title>
    <link rel="stylesheet" href="10_flexbox_aling.css">
</head>
<body>
    
    <h2>stretch (default)</h2>
    <div class="contenedor stretch">
      <div class="item">Inglés</div>
      <div class="item">Francés</div>
      <div class="item">Italiano</div>
    </div>
  
    <h2>flex-start</h2>
    <div class="contenedor inicio">
      <div class="item">Gramática</div>
      <div class="item">Lectura</div>
      <div class="item">Escritura</div>
    </div>
  
    <h2>flex-end</h2>
    <div class="contenedor fin">
      <div class="item">Nivel A1</div>
      <div class="item">Nivel B1</div>
      <div class="item">Nivel C1</div>
    </div>
  
    <h2>center</h2>
    <div class="contenedor centro">
      <div class="item">Curso</div>
      <div class="item">Profesor</div>
      <div class="item">Alumno</div>
    </div>
  
    <h2>baseline</h2>
    <div class="contenedor baseline">
      <div class="item">Hablar</div>
      <div class="item">Pronunciación avanzada</div>
      <div class="item">Conversación internacional</div>
    </div>
  
  
  </body>
  </html>
