<body>
    <h1>Terminos importantes</h1>
    <d1>
        <dt>Curso Intensivo</dt>
        <dd>Un curso de alta intensidad que se desarrolla en un período de tiempo relativamente corto.</dd>
        <dt>Curso Regular</dt>
        <dd>Un curso que se desarrolla en un período de tiempo más largo y con una carga horaria menor.</dd>
        <dt>Tutoría</dt>
        <dd>Servicio de apoyo académico.</dd>
    </d1>
</body>
