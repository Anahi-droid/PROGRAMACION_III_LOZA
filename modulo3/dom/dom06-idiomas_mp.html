<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalLingua - Escuela de Idiomas</title>
    <script src="idiomas_mp.js" defer></script>
</head>

<body>
    <h1 id="titulo">GlobalLingua - Idiomas del Mundo</h1>
    <h2>Interacción Táctil y Mouse</h2>
    <h2>Selector Móvil de Idiomas</h2>
    
    <div id="container" style="position:relative; width:100%; height:400px; background:#f0f4f8; margin-top:20px; border-radius: 8px;">
        <div id="circulo"
            style="width:90px; height:90px; background:#2b6cb0; border-radius:50%; position:absolute; top:100px; left:100px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            Inglés
        </div>
    </div>


    <div style="margin-top:20px;">
        <button id="botonAnimado" style="padding:12px 24px; font-size:18px; background:#319795; color:white; border:none; border-radius:6px; cursor:pointer; transition: all 0.3s;">¡Inscríbete o pasa el mouse!</button>
    </div>


    <div id="contenedorTriangulo"
        style="position:relative; width:100%; height:300px; margin-top:20px; background:#f0f4f8; border-radius: 8px;">
        <div id="triangulo" style="
       width: 0;
       height: 0;
       border-left: 50px solid transparent;
       border-right: 50px solid transparent;
       border-bottom: 100px solid #d69e2e;
       position: absolute;
       top: 100px;
       left: calc(50% - 50px);
       transition: transform 0.2s ease;">
        </div>
    </div>
</body>

</html>
