<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Idiomas</title>
    <script src="academia_cursos_mp.js" defer></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        h2 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .formulario {
            background-color: #eef4fb;
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }

        .formulario input {
            margin: 5px;
            padding: 8px;
            width: 200px;
        }

        .formulario button {
            width: 120px;
            padding: 5px;
            margin-bottom: 8px;
        }

        .btn-agregar:hover {
            background-color: #4CAF50;
            color: white;
        }

        .btn-cancelar:hover {
            background-color: #d6871f;
            color: white;
        }

        .stat-card {
            display: inline-block;
            width: 220px;
            padding: 15px;
            margin: 10px;
            background-color: #80dcec;
            border: 1px solid #ea3a3a;
            border-radius: 5px;
            text-align: center;
        }

        .stat-card h3 {
            margin-bottom: 10px;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>Academia de Idiomas</h1>
    <h2>CRUD de Cursos</h2>

    <div id="status">
        <div class="stat-card">
            <h3>Total Cursos</h3>
            <p id="totalCursos">0</p>
        </div>

        <div class="stat-card">
            <h3>Costo Promedio</h3>
            <p id="costoPromedio">0</p>
        </div>

        <div class="stat-card">
            <h3>Curso Más Costoso</h3>
            <p id="cursoMasCaro">N/A</p>
        </div>

        <div class="stat-card">
            <h3>Curso Más Económico</h3>
            <p id="cursoMasBarato">N/A</p>
        </div>
    </div>

    <div class="formulario">
        <h3>Agregar Curso</h3>

        <label>Idioma:</label>
        <input id="nombre" type="text" placeholder="Idioma">

        <label>Nivel:</label>
        <input id="descripcion" type="text" placeholder="Nivel">

        <label>Costo:</label>
        <input id="precio" type="number" placeholder="Costo">

        <button id="btn_agregar" class="btn-agregar">Agregar Curso</button>
        <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Idioma</th>
                <th>Nivel</th>
                <th>Costo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="cuerpoTabla"></tbody>
    </table>

</body>

</html>
