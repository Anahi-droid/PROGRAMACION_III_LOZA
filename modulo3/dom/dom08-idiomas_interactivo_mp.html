<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela de Idiomas - Interactivo</title>
    <script src="idiomas-interactivo.js" defer></script>
</head>

<body>
    <h1 id="titulo">Plataforma de Idiomas</h1>
    <h2>Control de Escala de Insignias</h2>
    
    <div id="contenedorInsignia"
        style="position:relative; width:100%; height:300px; margin-top:20px; background:#eef2f3;">
        <div id="insignia" style="
        width: 0;
        height: 0;
        border-left: 60px solid transparent;
        border-right: 60px solid transparent;
        border-bottom: 100px solid #2b5876;
        position: absolute;
        top: 100px;
        left: calc(50% - 60px);
        transition: transform 0.2s ease;">
        </div>
    </div>
</body>
</html>
